<!doctype html><html lang="uz"><head><meta charset="utf-8"><title>Avatar namunalari</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#070B1F;font-family:Manrope,sans-serif;color:#fff}
#st{position:absolute;inset:0;background:radial-gradient(900px 900px at 50% 45%,#13235A,#0B1233 45%,#070B1F 75%)}
#grid{position:absolute;inset:0;opacity:.09;background:repeating-linear-gradient(0deg,transparent 0 47px,#2ED3EA 47px 48px),repeating-linear-gradient(90deg,transparent 0 47px,#2ED3EA 47px 48px)}
.pill{position:absolute;left:50%;top:120px;transform:translateX(-50%);background:#2ED3EA;color:#06122a;font-weight:800;font-size:28px;letter-spacing:.14em;padding:10px 28px;border-radius:40px}
h1{position:absolute;top:200px;left:0;right:0;text-align:center;font-size:84px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
h1 span{color:#2ED3EA}
.card{position:absolute;width:450px;height:650px;border-radius:26px;border:3px solid var(--k);background:#0A1030;overflow:hidden;box-shadow:0 0 36px color-mix(in srgb,var(--k) 55%,transparent)}
.card .im{position:absolute;left:0;top:0;width:444px;height:470px;background-size:cover;background-position:center}
.card .lb{position:absolute;left:0;right:0;bottom:0;height:180px;background:#08102E;border-top:1px solid color-mix(in srgb,var(--k) 50%,transparent);text-align:center;padding:24px 16px 0}
.card .lb b{display:block;font-size:40px;font-weight:800}
.card .lb span{display:block;font-size:24px;font-weight:700;color:var(--k);margin-top:8px;line-height:1.25}
.num{position:absolute;left:18px;top:18px;background:var(--k);color:#06122a;font-weight:800;font-size:28px;padding:4px 14px;border-radius:12px}
.tag{position:absolute;right:16px;top:18px;font-weight:800;font-size:20px;padding:5px 12px;border-radius:10px;background:rgba(0,0,0,.55);border:1px solid var(--k);color:var(--k)}
</style></head><body><div id="st"><div id="grid"></div>
<div class="pill" id="p">● AVATAR NAMUNALARI</div>
<h1 id="h">Videoda qanday<br><span>odamlar?</span></h1>
<div id="cards"></div></div>
<script>
const C=[['#2ED3EA','1','AI portret','Fotorealistik · AI Studio / Higgsfield','img/ai.png','TAVSIYA'],
 ['#22C08A','2','Haqiqiy rasm','Jamoa a’zosining o‘z fotosi','img/real.png','ENG ISHONCHLI'],
 ['#9B7BFF','5','Chizilgan avatar','Kodda chiziladi · bepul, oddiy','img/drawn.png','BEPUL'],
 ['#F5A524','3–4','Harakat va nutq','Rasmdan video (Kling / Veo) yoki lip-sync','', 'PULLIK']];
const P=[[70,520],[560,520],[70,1220],[560,1220]];
document.getElementById('cards').innerHTML=C.map((c,i)=>`<div class="card" id="c${i}" style="--k:${c[0]};left:${P[i][0]}px;top:${P[i][1]}px">
 <div class="im" style="${c[4]?`background-image:url(${c[4]})`:'background:radial-gradient(circle at 50% 45%,#2a1d05,#0A1030 70%)'}">${c[4]?'':`<svg width="444" height="470" viewBox="0 0 444 470"><circle cx="222" cy="215" r="92" fill="none" stroke="#F5A524" stroke-width="8" style="filter:drop-shadow(0 0 14px #F5A524)"/><path d="M196 170 L268 215 L196 260 Z" fill="#F5A524"/><text x="222" y="370" fill="#F5A524" font-family="Manrope" font-weight="800" font-size="30" text-anchor="middle">namuna — ruxsat bilan</text></svg>`}</div>
 <div class="num">${c[1]}</div><div class="tag">${c[5]}</div>
 <div class="lb"><b>${c[2]}</b><span>${c[3]}</span></div></div>`).join('');
const cl=(x)=>Math.max(0,Math.min(1,x)),seg=(t,a,b)=>cl((t-a)/(b-a)),eo=(x)=>1-Math.pow(1-x,3),bk=(x)=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
window.TOTAL=6;
window.render=(t)=>{
 const p=document.getElementById('p'),h=document.getElementById('h');
 p.style.opacity=eo(seg(t,0,.3)); h.style.opacity=eo(seg(t,.2,.6)); h.style.transform=`translateY(${(1-eo(seg(t,.2,.6)))*40}px)`;
 C.forEach((_,i)=>{const e=document.getElementById('c'+i),s=seg(t,.7+i*.45,1.3+i*.45),q=bk(s);
  e.style.opacity=cl(s*2); e.style.transform=`perspective(1100px) rotateY(${(1-q)*-40}deg) rotateX(${(1-q)*10}deg) scale(${.9+.1*q}) translateY(${Math.sin(t*1.6+i)*6}px)`;});
};
window.render(0);
</script></body></html>
