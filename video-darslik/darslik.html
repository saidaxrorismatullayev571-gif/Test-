<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Maosh tizimi — video darslik</title>
<style>
:root{
  --bg1:#0a1222; --bg2:#101b33; --card:#15223f; --card2:#1b2b4f; --line:rgba(255,255,255,.09);
  --tx:#eef3ff; --mu:#9aaccc; --teal:#2dd4bf; --green:#34d399; --amber:#fbbf24; --red:#f87171;
  --blue:#60a5fa; --violet:#a78bfa; --pink:#f472b6;
}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
body{width:1920px;height:1080px;overflow:hidden;font-family:Inter,"DejaVu Sans",sans-serif;color:var(--tx)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1400px 900px at 20% 10%,#14254a 0,var(--bg1) 60%) ,var(--bg1)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:80px 80px}
#top{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:24px;padding:0 120px;z-index:5}
#brand{font-weight:800;font-size:24px;letter-spacing:.02em}
#brand b{color:var(--teal)}
#sec{margin-left:auto;font-size:22px;color:var(--mu);font-weight:600;padding:10px 20px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03)}
#prog{position:absolute;left:0;top:0;height:6px;background:linear-gradient(90deg,var(--teal),var(--blue));z-index:6}
#cap{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:1560px;min-height:120px;display:flex;align-items:center;justify-content:center;z-index:7}
#capbox{background:rgba(6,11,22,.82);border:1px solid var(--line);border-radius:22px;padding:22px 40px;font-size:34px;line-height:1.38;font-weight:500;text-align:center;max-width:1560px}
.scene{position:absolute;inset:0;padding:128px 120px 210px;opacity:0;display:flex;flex-direction:column}
.scene>.kicker{margin-top:auto}
.scene>:last-child{margin-bottom:auto}
.kicker{color:var(--teal);font-size:24px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin-bottom:10px}
h2{font-size:58px;line-height:1.08;font-weight:800;margin:0 0 34px;letter-spacing:-.01em}
.row{display:flex;gap:28px}
.col{display:flex;flex-direction:column;gap:22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:26px;padding:28px 30px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.card h3{margin:0 0 10px;font-size:34px;font-weight:800}
.card p{margin:0;font-size:25px;line-height:1.4;color:#c8d4ec}
.mu{color:var(--mu)}
.teal{color:var(--teal)}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.blue{color:var(--blue)}.violet{color:var(--violet)}
.num{font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:800;padding:8px 18px;font-size:22px}
.circ{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;flex:none}
.chip{display:inline-block;padding:8px 16px;border-radius:12px;font-size:22px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line);margin:4px 6px 4px 0}
.chip.k{background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.5);color:#bff5dc}
.eq{font-size:52px;font-weight:800;line-height:1.25}
.eq .op{color:var(--mu);font-weight:500;margin:0 14px}
.box{display:inline-block;padding:10px 24px;border-radius:18px;border:2px solid currentColor}
.stamp{position:absolute;right:-14px;top:18px;transform:rotate(8deg);border:4px solid var(--red);color:var(--red);font-weight:900;font-size:22px;padding:6px 14px;border-radius:10px;background:rgba(20,8,12,.85);letter-spacing:.06em}
.strike{position:absolute;left:4%;right:4%;top:50%;height:6px;background:var(--red);border-radius:4px;transform-origin:left center}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:27px}
table.t th{color:var(--mu);font-weight:700;text-align:left;padding:12px 18px;font-size:22px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
table.t td{padding:14px 18px;border-bottom:1px solid var(--line)}
.chart{position:relative;display:flex;align-items:flex-end;gap:40px;border-bottom:2px solid rgba(255,255,255,.25)}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bar{width:100%;border-radius:14px 14px 4px 4px;position:relative}
.bl{position:absolute;top:-44px;left:0;right:0;text-align:center;font-weight:800;font-size:28px;white-space:nowrap}
.bx{position:absolute;bottom:-50px;left:0;right:0;text-align:center;font-weight:800;font-size:30px}
.hline{position:absolute;left:0;right:0;border-top:3px dashed var(--amber)}
.hline span{position:absolute;left:0;top:-40px;color:var(--amber);font-weight:700;font-size:24px;background:var(--bg1);padding:0 8px}
.step{display:flex;gap:22px;align-items:flex-start}
.arrow{font-size:46px;color:var(--mu);font-weight:300}
.tl{position:relative;display:flex;gap:18px}
.tl .card{flex:1;padding:22px 22px}
.tl .card h3{font-size:28px}
.tl .card p{font-size:22px}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block}
.err{display:flex;gap:16px;align-items:flex-start}
.x{flex:none;width:44px;height:44px;border-radius:50%;background:rgba(248,113,113,.18);color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px}
.ok{flex:none;width:44px;height:44px;border-radius:50%;background:rgba(52,211,153,.18);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px}
.legend{display:flex;gap:26px;font-size:22px;color:#c8d4ec;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:18px;border-radius:5px;margin-right:8px;vertical-align:-2px}
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1" style="width:700px;height:700px;background:#1d4ed8"></div>
  <div class="blob" id="b2" style="width:600px;height:600px;background:#0d9488"></div>
  <div id="grid"></div>
  <div id="prog"></div>
  <div id="top"><div id="brand">Maosh tizimi <b>·</b> <span class="mu" style="font-weight:600">Sotuv moduli 05.2</span></div><div id="sec"></div></div>
  <div id="scenes"></div>
  <div id="cap"><div id="capbox"></div></div>
</div>
<script>
// ---------- helpers ----------
const A=(s,d=0,t='up',dur)=>`data-a="${t}" data-s="${s}" data-d="${d}"${dur!=null?` data-t="${dur}"`:''}`;
const C=(v,s,d=0,dec=0,suf='')=>`<span class="num" ${A(s,d,'count',1.2)} data-v="${v}" data-dec="${dec}" data-suf="${suf}">0</span>`;
const fmt=(v,dec=0)=>{const n=Math.abs(v).toFixed(dec);let [i,f]=n.split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (v<0?'-':'')+i+(f?','+f:'');};
const BAR=(h,color,s,d,label,x)=>`<div class="bcol"><div class="bar" style="background:${color};height:0" ${A(s,d,'hy',1)} data-h="${h}">${label?`<div class="bl">${label}</div>`:''}</div>${x?`<div class="bx">${x}</div>`:''}</div>`;

// ---------- scenes ----------
const S=[];
const add=(sec,segs,html)=>S.push({sec,segs,html});

add('Kirish',[
 'Assalomu alaykum! Bu darslikda sotuv menejeriga to‘g‘ri maosh tizimini tanlash va maoshni hisoblashni o‘rganamiz.',
 'Darslik rahbar va HR xodimlari uchun. Korxona ichki akademiyasi, Sotuv moduli.'
],`<div style="margin:auto 0;display:flex;flex-direction:column;gap:30px">
  <div ${A(0,0.2,'fade')} class="kicker">Video darslik · 05.2</div>
  <div ${A(0,0.4)} style="font-size:104px;font-weight:900;line-height:1.02;letter-spacing:-.02em">Maosh tizimini<br><span style="background:linear-gradient(90deg,var(--teal),var(--blue));-webkit-background-clip:text;color:transparent">tanlash va hisoblash</span></div>
  <div ${A(0,0.9)} style="font-size:36px;color:#c8d4ec">Sotuv menejeriga to‘g‘ri maosh berish</div>
  <div ${A(1,0.1)} style="display:flex;gap:16px"><span class="chip k">Rahbar uchun</span><span class="chip k">HR uchun</span><span class="chip">Korxona ichki akademiyasi</span></div>
</div>`);

add('Darslik rejasi',[
 'Bu darslik uch ishni qiladi.',
 'Birinchi: korxonangizga mos maosh tizimini tanlashga yordam beradi.',
 'Ikkinchi: xodimga tizimni bir daqiqada tushuntirish uchun tayyor matn beradi.',
 'Uchinchi: oy oxirida maoshni o‘n daqiqada hisoblash tartibini beradi.'
],`<div class="kicker" ${A(0,0,'fade')}>Reja</div><h2 ${A(0,0.1)}>Bu darslik 3 ishni qiladi</h2>
<div class="g3" style="margin-top:20px">
 ${[['1','Tanlash','Korxonangizga mos maosh tizimini tanlash','var(--teal)'],['2','Tushuntirish','Xodimga 1 daqiqada tushuntirish uchun tayyor matn','var(--blue)'],['3','Hisoblash','Oy oxirida maoshni 10 daqiqada hisoblash','var(--violet)']].map((c,i)=>`
 <div class="card" ${A(i+1,0,'pop')} style="padding:40px 34px;min-height:360px">
   <div class="circ" style="background:${c[3]};color:#08111f;width:84px;height:84px;font-size:42px">${c[0]}</div>
   <h3 style="margin-top:30px;font-size:42px">${c[1]}</h3><p style="font-size:28px">${c[2]}</p></div>`).join('')}
</div>`);

add('Ikki qoida',[
 'Boshlashdan oldin ikkita qoida. Istisnosiz.',
 'Birinchi qoida: sotuv menejeriga faqat oklad berish tavsiya etilmaydi. Na yangi, na tajribali xodimga.',
 'Ikkinchi qoida: maosh hech qachon faqat tushumdan ulushdan iborat bo‘lmasin. Doim aniq oklad bo‘ladi, ulush uning ustiga qo‘shiladi.'
],`<div class="kicker" ${A(0,0,'fade')}>Istisnosiz</div><h2 ${A(0,0.1)}>Ikki oltin qoida</h2>
<div class="g2">
 <div class="card" ${A(1,0,'left')} style="border-color:rgba(248,113,113,.45);min-height:300px;position:relative">
   <div class="x" style="width:70px;height:70px;font-size:36px">✕</div>
   <h3 style="margin-top:24px;font-size:44px">Faqat oklad</h3><p style="font-size:28px">Yangi xodimga ham, tajribali xodimga ham — <b class="red">yo‘q</b>.</p></div>
 <div class="card" ${A(2,0,'right')} style="border-color:rgba(248,113,113,.45);min-height:300px">
   <div class="x" style="width:70px;height:70px;font-size:36px">✕</div>
   <h3 style="margin-top:24px;font-size:44px">Okladsiz, faqat ulush</h3><p style="font-size:28px">Maosh faqat tushumdan ulushdan iborat bo‘lmasin.</p></div>
</div>
<div ${A(2,1.6,'pop')} style="margin-top:30px;align-self:center" class="card"><span class="eq" style="font-size:44px"><span class="green">✓</span> <span class="teal">Aniq oklad</span><span class="op">+</span><span class="amber">natijaga bog‘liq qism</span></span></div>`);

add('Atamalar lug‘ati',[
 'Avval asosiy atamalarni bilib olaylik.',
 'KPI — xodim oy davomida bajarishi kerak bo‘lgan aniq raqam. Masalan, oyiga 60 million so‘m sotuv yoki kuniga 30 ta qo‘ng‘iroq.',
 'CRM — kompyuterdagi mijozlar daftari. Kim qo‘ng‘iroq qildi, nima gaplashildi, kim sotib oldi — hammasi shu yerda yoziladi.',
 'Lid — murojaat qilgan, lekin hali sotib olmagan odam. Bitim — mijoz rozi bo‘lib, pulini to‘lagan savdo.',
 'Tushum — hisobingizga haqiqatan tushgan pul. 10 millionlik shartnomadan 4 million to‘langan bo‘lsa, tushum — 4 million.'
],`<div class="kicker" ${A(0,0,'fade')}>1-bo‘lim</div><h2 ${A(0,0.1)}>Atamalar lug‘ati</h2>
<div class="g4" style="grid-template-columns:1fr 1fr 1fr 1.25fr">
 <div class="card" ${A(1,0,'pop')}><h3 class="teal">KPI</h3><p>Oy davomida bajariladigan <b>aniq raqam</b>.</p><p class="mu" style="margin-top:14px;font-size:22px">Oyiga 60 mln so‘m sotuv</p></div>
 <div class="card" ${A(2,0,'pop')}><h3 class="blue">CRM</h3><p>Kompyuterdagi <b>mijozlar daftari</b>.</p><p class="mu" style="margin-top:14px;font-size:22px">amoCRM, Bitrix24, Excel</p></div>
 <div class="card" ${A(3,0,'pop')}><h3 class="violet">Lid → Bitim</h3><p><b>Lid</b> — murojaat qilgan, hali sotib olmagan.</p><p style="margin-top:10px"><b>Bitim</b> — pul to‘langan savdo.</p></div>
 <div class="card" ${A(4,0,'pop')}><h3 class="green">Tushum</h3><p>Hisobga <b>haqiqatan tushgan</b> pul.</p>
   <div style="margin-top:22px;font-size:20px" class="mu">Shartnoma: 10 mln</div>
   <div style="height:34px;border-radius:10px;background:rgba(255,255,255,.08);position:relative;overflow:hidden;margin-top:6px">
     <div style="position:absolute;left:0;top:0;bottom:0;background:var(--green);width:0" ${A(4,0.8,'wx',1.2)} data-w="40"></div></div>
   <div style="margin-top:8px;font-size:24px;font-weight:800" class="green" ${A(4,1.8,'fade')}>Tushum = 4 mln</div></div>
</div>`);

add('Atamalar lug‘ati',[
 'Maosh qismlarini ham bilib olaylik.',
 'Oklad — har oy kafolatlangan summa. Sotuv bo‘lsa ham, bo‘lmasa ham beriladi.',
 'Bonus — KPI bajarilsa beriladigan qo‘shimcha pul. Bonus fondi esa bonusning eng ko‘p bo‘lishi mumkin bo‘lgan summasi.',
 'Ulush — sotuvning foiz bilan belgilangan qismi. Masalan, 10 million tushumning 5 foizi — 500 ming so‘m.'
],`<div class="kicker" ${A(0,0,'fade')}>1-bo‘lim</div><h2 ${A(0,0.1)}>Maosh nimadan iborat bo‘ladi?</h2>
<div class="row" style="align-items:stretch;gap:36px">
 <div style="width:330px;display:flex;flex-direction:column-reverse;gap:8px;height:520px">
   <div ${A(1,0,'hy',1)} data-h="45" style="height:0;background:var(--teal);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#06201c;overflow:hidden">OKLAD</div>
   <div ${A(2,0,'hy',1)} data-h="27" style="height:0;background:var(--blue);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#071a33;overflow:hidden">BONUS</div>
   <div ${A(3,0,'hy',1)} data-h="24" style="height:0;background:var(--amber);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#2a1c00;overflow:hidden">ULUSH</div>
 </div>
 <div class="col" style="flex:1;justify-content:center">
  <div class="card" ${A(1,0.3,'right')}><h3 class="teal">Oklad</h3><p>Har oy <b>kafolatlangan</b> summa. Sotuv bo‘lsa ham, bo‘lmasa ham.</p></div>
  <div class="card" ${A(2,0.3,'right')}><h3 class="blue">Bonus va bonus fondi</h3><p>KPI bajarilsa qo‘shimcha pul. <b>Bonus fondi</b> — bonusning eng ko‘p summasi.</p></div>
  <div class="card" ${A(3,0.3,'right')}><h3 class="amber">Ulush (%)</h3><p>10 000 000 × 5% = <b class="amber">${C(500000,3,1)}</b> so‘m</p></div>
 </div>
</div>`);

add('Atamalar lug‘ati',[
 'Endi hisoblashda kerak bo‘ladigan atamalar.',
 'Konversiya — 100 ta murojaatdan nechtasi sotib olgani. 100 tadan 20 tasi sotib olsa, konversiya 20 foiz.',
 'Bajarilish foizi — haqiqiy raqamni maqsadga bo‘lib, 100 ga ko‘paytiramiz. Maqsad 60 million, bajarilgani 45 million bo‘lsa — 75 foiz.',
 'Vazn — KPI maoshga qanchalik ta’sir qilishi. Hamma KPI vaznlari yig‘indisi 100 foiz bo‘ladi.',
 'Eshik qoidasi — KPI bajarilishi 50 foizdan past bo‘lsa, shu KPI bo‘yicha bonus berilmaydi.'
],`<div class="kicker" ${A(0,0,'fade')}>1-bo‘lim</div><h2 ${A(0,0.1)}>Hisoblash atamalari</h2>
<div class="g4">
 <div class="card" ${A(1,0,'pop')}><h3 class="teal">Konversiya</h3>
  <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:14px 0">${Array.from({length:100},(_,i)=>`<div style="aspect-ratio:1;border-radius:3px;background:${i<20?'var(--teal)':'rgba(255,255,255,.12)'}" ${i<20?A(1,0.6+i*0.05,'pop',0.3):''}></div>`).join('')}</div>
  <p><b class="teal">20</b> / 100 = <b class="teal">20%</b></p></div>
 <div class="card" ${A(2,0,'pop')}><h3 class="blue">Bajarilish %</h3><p style="font-size:24px">haqiqiy ÷ maqsad × 100</p>
  <div style="margin-top:26px;font-size:30px;font-weight:800">45 ÷ 60 =</div><div style="font-size:72px;font-weight:900" class="blue">${C(75,2,0.8,0,'%')}</div></div>
 <div class="card" ${A(3,0,'pop')}><h3 class="violet">Vazn</h3><p style="font-size:24px">Yig‘indi doim 100%</p>
  <div style="display:flex;height:48px;border-radius:10px;overflow:hidden;margin-top:30px">
   <div style="width:0;background:var(--teal)" ${A(3,0.5,'wx',0.7)} data-w="40"></div><div style="width:0;background:var(--blue)" ${A(3,1.0,'wx',0.5)} data-w="20"></div><div style="width:0;background:var(--violet)" ${A(3,1.4,'wx',0.5)} data-w="20"></div><div style="width:0;background:var(--amber)" ${A(3,1.8,'wx',0.5)} data-w="20"></div></div>
  <p style="margin-top:14px;font-size:22px" class="mu">40 + 20 + 20 + 20 = 100</p></div>
 <div class="card" ${A(4,0,'pop')} style="border-color:rgba(251,191,36,.45)"><h3 class="amber">Eshik qoidasi</h3><p style="font-size:24px">Bajarilish &lt; 50% → shu KPI bo‘yicha bonus <b>0</b></p>
  <div style="position:relative;height:40px;border-radius:10px;background:rgba(255,255,255,.08);margin-top:34px">
   <div style="position:absolute;left:50%;top:-12px;bottom:-12px;border-left:4px dashed var(--amber)"></div>
   <div style="position:absolute;left:0;top:0;bottom:0;width:0;background:var(--red);border-radius:10px" ${A(4,0.6,'wx',1)} data-w="45"></div></div>
  <p style="margin-top:14px;font-size:22px" class="mu">45% — eshikdan o‘tmadi</p></div>
</div>`);

add('4 shart',[
 'Yaxshi maosh tizimi to‘rtta savolga «ha» deb javob berishi kerak. Aks holda tizim bir-ikki oyda buziladi.',
 'Birinchi: tushunarlimi? Xodim «bu oy qancha olaman» degan savolga bir daqiqada o‘zi javob bera oladimi?',
 'Ikkinchi: xodim ta’sir qila oladimi? Maosh xodimning o‘z ishiga bog‘liqmi?',
 'Uchinchi: korxonaga foydalimi? Xodim ko‘p ishlasa, korxona ham ko‘p topadimi?',
 'To‘rtinchi: hisoblash osonmi? Rahbar oy oxirida maoshni 10–15 daqiqada hisoblay oladimi?'
],`<div class="kicker" ${A(0,0,'fade')}>2-bo‘lim</div><h2 ${A(0,0.1)}>Yaxshi maosh tizimining 4 sharti</h2>
<div class="g2" style="gap:24px">
 ${[['Tushunarli','Xodim «qancha olaman?» savoliga 1 daqiqada javob beradi','Bo‘lmasa: har oy tortishuv'],['Xodim ta’sir qila oladi','Maosh xodimning o‘z ishiga bog‘liq','Bo‘lmasa: «baribir o‘zgarmaydi»'],['Korxonaga foydali','Xodim ko‘p ishlasa, korxona ham ko‘p topadi','Bo‘lmasa: zarar yoki yaxshi xodim ketadi'],['Hisoblash oson','Rahbar 10–15 daqiqada hisoblaydi','Bo‘lmasa: kechikish va xato']].map((c,i)=>`
 <div class="card" ${A(i+1,0,'up')} style="display:flex;gap:24px;align-items:flex-start">
  <div class="ok" style="width:62px;height:62px;font-size:34px" ${A(i+1,0.6,'pop')}>✓</div>
  <div><h3 style="font-size:32px">${i+1}. ${c[0]}</h3><p>${c[1]}</p><p class="red" style="font-size:21px;margin-top:8px">${c[2]}</p></div></div>`).join('')}
</div>`);

add('4 variant',[
 'Maosh tizimining to‘rt varianti bor.',
 'Birinchi variant — faqat oklad. Har oy bir xil summa, natijaga bog‘liq emas. Bu variant tavsiya etilmaydi.',
 'Ikkinchi variant — oklad va KPI bonus. Barqaror daromad va nazorat birga. Lekin bonusning yuqori chegarasi bor.',
 'Uchinchi variant — oklad va tushumdan ulush. Ko‘p sotsa, ko‘p oladi.',

// ---------- timing ----------
const segDur=txt=>Math.max(3.2, txt.length/16.5+1.0);
let T=0;
S.forEach((sc,i)=>{sc.start=T;sc.segStart=[];let t=0.5;sc.segs.forEach(s=>{sc.segStart.push(t);t+=segDur(s);});sc.dur=t+0.9;T+=sc.dur;});
const TOTAL=T;

// ---------- build DOM ----------
const root=document.getElementById('scenes');
S.forEach((sc,i)=>{const d=document.createElement('div');d.className='scene';d.innerHTML=sc.html;root.appendChild(d);sc.el=d;
 sc.anims=[...d.querySelectorAll('[data-a]')].map(el=>({el,a:el.dataset.a,s:+el.dataset.s,d:+el.dataset.d,t:el.dataset.t?+el.dataset.t:(el.dataset.a=='count'?1.2:0.7)}));
 sc.anims.forEach(o=>{if(o.a=='draw'){o.len=o.el.getTotalLength();o.el.style.strokeDasharray=o.len;}});
});

const clamp=x=>x<0?0:x>1?1:x;
const eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const capbox=document.getElementById('capbox'),secEl=document.getElementById('sec'),prog=document.getElementById('prog');
let lastCap=null,lastScene=null;

function render(t){
 // background
 document.getElementById('b1').style.transform=`translate(${-200+Math.sin(t*0.07)*160}px,${-250+Math.cos(t*0.05)*120}px)`;
 document.getElementById('b2').style.transform=`translate(${1350+Math.cos(t*0.06)*180}px,${520+Math.sin(t*0.08)*140}px)`;
 prog.style.width=(t/TOTAL*100)+'%';
 let idx=S.findIndex(sc=>t>=sc.start&&t<sc.start+sc.dur); if(idx<0) idx=S.length-1;
 const sc=S[idx], lt=t-sc.start;
 if(lastScene!==idx){S.forEach((o,j)=>{if(j!==idx)o.el.style.opacity=0;});secEl.textContent=sc.sec;lastScene=idx;}
 const fin=clamp(lt/0.45), fout=clamp((sc.dur-lt)/0.45);
 sc.el.style.opacity=Math.min(fin,fout);
 sc.el.style.transform=`scale(${1+0.015*(1-fin)})`;
 for(const o of sc.anims){
  const st=sc.segStart[o.s]+o.d; const raw=clamp((lt-st)/o.t); const p=eo(raw); const el=o.el;
  switch(o.a){
   case 'up': el.style.opacity=p; el.style.transform=`translateY(${(1-p)*40}px)`; break;
   case 'fade': el.style.opacity=p; break;
   case 'left': el.style.opacity=p; el.style.transform=`translateX(${-(1-p)*70}px)`; break;
   case 'right': el.style.opacity=p; el.style.transform=`translateX(${(1-p)*70}px)`; break;
   case 'pop': el.style.opacity=clamp(raw*2); el.style.transform=`scale(${0.6+0.4*back(raw)})`; break;
   case 'wx': el.style.width=(p*+el.dataset.w)+'%'; break;
   case 'hy': el.style.height=(p*+el.dataset.h)+'%'; break;
   case 'sx': el.style.transform=`scaleX(${p})`; break;
   case 'draw': el.style.strokeDashoffset=o.len*(1-p); break;
   case 'count': {const dec=+el.dataset.dec; el.textContent=fmt(p*+el.dataset.v,dec)+(el.dataset.suf||''); el.style.opacity=raw>0?1:0.25; break;}
  }
 }
 // caption
 let si=0; for(let k=0;k<sc.segStart.length;k++) if(lt>=sc.segStart[k]-0.3) si=k;
 const key=idx+':'+si; if(key!==lastCap){capbox.textContent=sc.segs[si];lastCap=key;}
 const cst=sc.segStart[si]-0.3; capbox.style.opacity=Math.min(clamp((lt-cst)/0.3), fout<1&&si==sc.segs.length-1?Math.max(fout,0):1);
}
window.TOTAL=TOTAL; window.render=render;
window.SRT=()=>{const ts=x=>{const h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=Math.floor(x%60),ms=Math.round((x%1)*1000);return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(ms).padStart(3,'0')}`;};
 let n=1,out='';S.forEach(sc=>sc.segs.forEach((s,k)=>{const a=sc.start+sc.segStart[k]-0.3,b=k+1<sc.segs.length?sc.start+sc.segStart[k+1]-0.3:sc.start+sc.dur-0.2;out+=`${n++}\n${ts(a)} --> ${ts(b)}\n${s}\n\n`;}));return out;};
window.CHAPTERS=()=>S.map(sc=>[sc.start,sc.sec]);
// live preview when opened in a browser
if(!/render=1/.test(location.search)){const t0=performance.now();(function loop(){render(((performance.now()-t0)/1000)%TOTAL);requestAnimationFrame(loop);})();}
</script>
